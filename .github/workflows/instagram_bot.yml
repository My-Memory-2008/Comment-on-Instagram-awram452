
name: Instagram AI Engagement Bot (Local Qwen)

on:
  workflow_dispatch: # Allows manual test triggers


permissions:
  contents: read
  actions: write


jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install requests

      # - name: Cache Ollama Models
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.ollama
      #     key: ${{ runner.os }}-ollama-${{ hashFiles('**/reply_bot.py') }}
      #     restore-keys: |
      #       ${{ runner.os }}-ollama-




      - name: Cache Ollama Models and Reply Database
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
            replied_comments_cache.json
          key: ${{ runner.os }}-ollama-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ollama-history-

      


      
      - name: Install and Boot Ollama Service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "⏳ Waiting for Ollama background daemon to stabilize..."
          sleep 5

      - name: Pull Qwen Model weights
        run: ollama pull qwen2.5:1.5b

      - name: Run AI Engagement Script
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python reply_bot.py


      - name: Wait 20 seconds before triggering restart.yml
        run: |
          echo "Waiting 20 seconds before triggering automate.yml..."
          sleep 20

      - name: Trigger restart.yml with Retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering restart.yml on branch/tag: ${{ github.ref_name }}"
          
          MAX_ATTEMPTS=10
          ATTEMPT=1
          SUCCESS=false
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if gh workflow run restart.yml --ref "${{ github.ref_name }}"; then
              echo "restart.yml triggered successfully."
              SUCCESS=true
              break
            else
              echo "Attempt $ATTEMPT failed."
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 15 seconds before next retry..."
                sleep 15
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "Error: Failed to trigger restart.yml after $MAX_ATTEMPTS attempts."
            exit 1
          fi
          
          echo "instagram_bot.yml will now finish and terminate."
